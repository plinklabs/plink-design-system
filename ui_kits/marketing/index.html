<!-- @dsCard group="Marketing Site" viewport="1280x900" name="Marketing — Home" subtitle="Hero, products, the ink mission section, footer" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plink Labs — a sound lab for the classroom</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .mk-spark { color: var(--magenta); }
  .mk-spark-dark { color: var(--magenta-on-dark); }
  .mk-wrap { max-width: var(--container); margin: 0 auto; padding: 0 var(--gutter); }

  /* ── nav ─────────────────────────────────────────── */
  .mk-nav { max-width: var(--container); margin: 0 auto; padding: 26px var(--gutter) 0; display: flex; align-items: center; justify-content: space-between; }
  .mk-nav__links { display: flex; align-items: center; gap: 26px; font-size: var(--text-sm); font-weight: 500; }
  .mk-nav__links a { opacity: 0.78; transition: opacity var(--dur-fast) var(--ease-standard); }
  .mk-nav__links a:hover { opacity: 1; }

  /* ── hero ────────────────────────────────────────── */
  .mk-hero { position: relative; max-width: var(--container); margin: 0 auto; padding: 84px var(--gutter) 0; }
  .mk-hero__watermark { position: absolute; left: -40px; top: 0; width: 360px; height: 360px; opacity: 0.06; pointer-events: none; }
  .mk-hero .pl-eyebrow { margin-bottom: 26px; position: relative; }
  .mk-hero__h1 { font-family: var(--font-display); font-weight: var(--display-weight); font-optical-sizing: auto; font-size: clamp(3rem, 6.6vw, 5.4rem); line-height: 0.98; letter-spacing: -0.018em; margin: 0; max-width: 15ch; position: relative; }
  .mk-hero__ping { display: inline-block; margin-left: 0.06em; }
  .mk-hero__lede { font-size: var(--text-xl); line-height: 1.5; color: var(--ink-60); max-width: 46ch; margin: 30px 0 0; }
  .mk-hero__actions { display: flex; align-items: center; gap: 22px; margin: 38px 0 0; }
  .mk-hero__scope { margin: 70px 0 22px; }

  /* ── section divider ─────────────────────────────── */
  .mk-divider { max-width: var(--container); margin: 0 auto; padding: 56px var(--gutter); }

  /* ── section head (shared) ───────────────────────── */
  .mk-section-head { max-width: 38ch; }
  .mk-section-num { font-family: var(--font-mono); font-size: var(--label); letter-spacing: var(--label-tracking); text-transform: uppercase; color: var(--muted); }
  .mk-section-title { font-family: var(--font-display); font-weight: var(--display-weight); font-optical-sizing: auto; font-size: clamp(2rem, 3.6vw, 3rem); line-height: 1.04; letter-spacing: -0.015em; margin: 16px 0 0; max-width: 18ch; }
  .mk-section-lede { font-size: var(--text-lg); line-height: 1.5; color: var(--ink-60); margin: 18px 0 0; max-width: 50ch; }

  /* ── products ────────────────────────────────────── */
  .mk-products { max-width: var(--container); margin: 0 auto; padding: 0 var(--gutter); }
  .mk-product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 48px; }
  .mk-product { display: flex; flex-direction: column; min-height: 220px; padding: var(--space-5); }
  .mk-product__mark { display: block; margin-bottom: 20px; }
  .mk-product__name { font-family: var(--font-display); font-weight: var(--display-weight); font-optical-sizing: auto; font-size: 1.5rem; letter-spacing: -0.01em; margin: 0 0 8px; }
  .mk-product__desc { font-size: var(--text-sm); line-height: 1.5; color: var(--ink-60); margin: 0 0 20px; flex: 1; }
  .mk-product__foot { display: flex; align-items: center; justify-content: space-between; }
  .mk-product__open { font-family: var(--font-mono); font-size: var(--label); color: var(--ink); opacity: 0; transform: translateX(-4px); transition: opacity var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); }
  .mk-product:hover .mk-product__open { opacity: 1; transform: translateX(0); color: var(--magenta); }

  /* ── mission — the one full-bleed ink section ─────── */
  .mk-mission { background: var(--ink); color: var(--on-ink); margin-top: 56px; padding: 96px 0; }
  .mk-mission__statement { font-family: var(--font-display); font-weight: var(--display-weight); font-optical-sizing: auto; font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1.08; letter-spacing: -0.015em; margin: 28px 0 0; max-width: 22ch; }
  .mk-mission__cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin: 72px 0 0; }
  .mk-mission__col { border-top: 1px solid var(--hairline-on-ink); padding-top: 18px; }
  .mk-mission__col p { font-size: var(--text-base); line-height: 1.5; color: var(--on-ink); margin: 14px 0 0; max-width: 32ch; }
  .mk-mono-num { font-family: var(--font-mono); font-size: var(--label); color: var(--magenta-on-dark); letter-spacing: var(--label-tracking); }
  .mk-mission__foot { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; margin: 64px 0 0; }
  .mk-mission__foot .pl-specstrip { flex: 1; min-width: 280px; }

  /* ── footer ──────────────────────────────────────── */
  .mk-footer { max-width: var(--container); margin: 0 auto; padding: 72px var(--gutter) 40px; }
  .mk-footer__top { display: flex; justify-content: space-between; gap: 60px; flex-wrap: wrap; }
  .mk-footer__brand { max-width: 30ch; }
  .mk-footer__note { font-size: var(--text-sm); line-height: 1.5; color: var(--ink-60); margin: 18px 0 0; }
  .mk-footer__cols { display: flex; gap: 56px; flex-wrap: wrap; }
  .mk-footer__h { font-family: var(--font-mono); font-size: var(--label); text-transform: uppercase; letter-spacing: var(--label-tracking-tight); color: var(--muted); margin-bottom: 14px; }
  .mk-footer__col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .mk-footer__col a { font-size: var(--text-sm); color: var(--ink); opacity: 0.8; }
  .mk-footer__col a:hover { opacity: 1; color: var(--magenta); }
  .mk-footer__bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--hairline); font-family: var(--font-mono); font-size: var(--label-sm); color: var(--muted); }

  @media (max-width: 860px) {
    .mk-product-grid, .mk-mission__cols { grid-template-columns: 1fr; }
    .mk-nav__links a:not(.pl-btn) { display: none; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Products.jsx"></script>
  <script type="text/babel" src="Mission.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel">
    const { PingDivider } = window.PlinkLabsDesignSystem_59a0ef;
    function App() {
      return (
        <>
          <Nav />
          <Hero />
          <div className="mk-divider"><PingDivider position={0.36} /></div>
          <Products />
          <Mission />
          <Footer />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
