<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); padding: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }

  .pl-switch, .pl-check { white-space: nowrap; }
  .glabel { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 14px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
<script type="text/babel">
  const { Input, Switch, Checkbox } = window.PlinkLabsDesignSystem_59a0ef;
  ReactDOM.createRoot(document.getElementById('root')).render(
    <div className="grid">
      <div>
        <div className="glabel">Input</div>
        <div className="stack">
          <Input label="School email" type="email" placeholder="you@school.edu" />
          <Input label="Comment" multiline rows={3} defaultValue="Works great on the projector." />
        </div>
      </div>
      <div>
        <div className="glabel">Switch & Checkbox</div>
        <div className="stack">
          <Switch label="Offline mode" defaultChecked />
          <Switch label="Send anonymous stats" />
          <Checkbox label="No ads, ever" defaultChecked />
          <Checkbox label="No tracking" defaultChecked />
          <Checkbox label="Marketing email" />
        </div>
      </div>
    </div>
  );
</script>
</body>
</html>
