<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>

</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
<script type="text/babel">
  const { Button, Badge, Card, SpecStrip } = window.PlinkLabsDesignSystem_59a0ef;
  ReactDOM.createRoot(document.getElementById('root')).render(
    <>
      <div className="group">
        <div className="glabel">Button — variants</div>
        <div className="row">
          <Button variant="primary">Browse products →</Button>

          <Button variant="outline">Docs</Button>

          <Button variant="primary" disabled>Disabled</Button>

      <div className="group">

          <Badge variant="outline">GPL-3.0</Badge>
          <Badge variant="spark" dot>Live</Badge>
          <Badge variant="ink">v2.4</Badge>
          <Badge variant="accent">New</Badge>

      </div>
      <div className="group">
        <div className="glabel">Card — flat + hairline</div>
        <div className="cards">
          <Card num="01"><h3>Timer</h3><p className="body">A big, calm classroom countdown. Works offline.</p></Card>
          <Card variant="ink" num="02"><h3 style={{color:'var(--on-ink)'}}>Picker</h3><p className="body" style={{color:'var(--on-ink-muted)'}}>The one full-bleed ink panel.</p></Card>
        </div>
      </div>
      <div className="group">
        <div className="glabel">SpecStrip</div>
        <SpecStrip items={["GPL-3.0", "GDPR-clean", "Works offline", "16px → projector"]} />
      </div>
    </>
  );

</html>
