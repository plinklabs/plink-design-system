<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="8px base — baseline-friendly rhythm" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-mono); padding: 24px 28px; box-sizing: border-box; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { text-align: center; }
  .bar { background: var(--magenta); width: 100%; border-radius: 2px; }
  .v { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .t { font-size: 11px; color: var(--ink); }
</style>
</head>
<body>
  <div class="row">
    <div class="item" style="width:32px;"><div class="bar" style="height:8px;"></div><div class="t">2</div><div class="v">8</div></div>
    <div class="item" style="width:32px;"><div class="bar" style="height:12px;"></div><div class="t">3</div><div class="v">12</div></div>
    <div class="item" style="width:32px;"><div class="bar" style="height:16px;"></div><div class="t">4</div><div class="v">16</div></div>
    <div class="item" style="width:32px;"><div class="bar" style="height:24px;"></div><div class="t">5</div><div class="v">24</div></div>
    <div class="item" style="width:32px;"><div class="bar" style="height:32px;"></div><div class="t">6</div><div class="v">32</div></div>
    <div class="item" style="width:32px;"><div class="bar" style="height:48px;"></div><div class="t">7</div><div class="v">48</div></div>
    <div class="item" style="width:32px;"><div class="bar" style="height:64px;"></div><div class="t">8</div><div class="v">64</div></div>
  </div>
</body>
</html>
