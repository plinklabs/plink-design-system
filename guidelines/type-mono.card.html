<!-- @dsCard group="Type" viewport="700x170" name="Labels — Space Mono" subtitle="Section numbers, tags, specs — the Labs signature" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-mono); padding: 24px 28px; box-sizing: border-box; }
  .lbl { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 18px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--magenta); }
  .nums { display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
  .nums b { color: var(--ink); }
  .specs { display: flex; font-size: 12px; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--hairline); padding-top: 12px; margin-top: 18px; }
  .specs span { padding: 0 14px; border-right: 1px solid var(--hairline); }
  .specs span:first-child { padding-left: 0; }
  .specs span:last-child { border-right: none; }
</style>
</head>
<body>
  <div class="lbl">Space Mono · 400 / 700</div>
  <p class="eyebrow"><span class="dot"></span> Open source — free for every classroom</p>
  <div class="nums"><span><b>01</b> / 04</span><span><b>02</b> / 04</span><span><b>03</b> / 04</span></div>
  <div class="specs"><span>GPL-3.0</span><span>GDPR-clean</span><span>Works offline</span></div>
</body>
</html>
