<!-- @dsCard group="Colors" viewport="700x150" name="Muted & hairlines" subtitle="Secondary text and 1px instrument rules" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-mono); padding: 22px; box-sizing: border-box; }
  .row { display: flex; gap: 16px; }
  .sw { flex: 1; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--hairline); }
  .hex { font-size: 12px; letter-spacing: 0.04em; color: var(--ink); margin-top: 10px; }
  .nm { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .rule { margin-top: 30px; }
  .rule .h { border-top: 1px solid var(--hairline); }
  .rule .h2 { border-top: 1px solid var(--hairline-strong); margin-top: 14px; }
  .lbl { font-size: 11px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#6E6A62"></div><div class="hex">#6E6A62</div><div class="nm">--ink-60 · body-muted</div></div>
    <div class="sw"><div class="chip" style="background:#9A958B"></div><div class="hex">#9A958B</div><div class="nm">--muted · captions</div></div>
    <div class="sw rule">
      <div class="h"></div><div class="lbl">--hairline · rgba(27,27,35,.14)</div>
      <div class="h2"></div><div class="lbl">--hairline-strong · .26</div>
    </div>
  </div>
</body>
</html>
