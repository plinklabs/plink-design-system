<!-- @dsCard group="Colors" viewport="700x150" name="Magenta — the spark" subtitle="Mark, one word, the pulse, one action. <5% of pixels." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-mono); padding: 22px; box-sizing: border-box; }
  .row { display: flex; gap: 16px; }
  .sw { flex: 1; }
  .chip { height: 76px; border-radius: var(--radius); }
  .hex { font-size: 12px; letter-spacing: 0.04em; color: var(--ink); margin-top: 10px; }
  .nm { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ondark { background: var(--ink); display: grid; place-items: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#DB2777"></div><div class="hex">#DB2777</div><div class="nm">--magenta · on light</div></div>
    <div class="sw"><div class="chip" style="background:#C01F68"></div><div class="hex">#C01F68</div><div class="nm">--magenta-press</div></div>
    <div class="sw"><div class="chip ondark"><div style="width:48px;height:48px;border-radius:var(--radius);background:#EC4899"></div></div><div class="hex">#EC4899</div><div class="nm">--magenta-on-dark</div></div>
  </div>
</body>
</html>
