<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); padding: 24px 28px; box-sizing: border-box; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 12px; }
  .d { font-family: var(--font-display); font-weight: var(--display-weight); font-optical-sizing: auto; line-height: 0.98; letter-spacing: -0.018em; margin: 0; }
  .spark { color: var(--magenta); }
</style>
</head>
<body>
  <div class="lbl">Fraunces · 300 · display</div>
  <p class="d" style="font-size:60px;">Good <span class="spark">software</span></p>
  <p class="d" style="font-size:34px; margin-top:10px;">for the classroom.</p>
</body>
</html>
