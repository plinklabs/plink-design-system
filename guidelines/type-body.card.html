<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); padding: 24px 28px; box-sizing: border-box; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 14px; }
  .lede { font-size: 19px; line-height: 1.5; color: var(--ink-60); max-width: 46ch; margin: 0 0 12px; }
  .base { font-size: 16px; line-height: 1.5; margin: 0; }
  .base b { font-weight: 600; }
</style>
</head>
<body>
  <div class="lbl">Hanken Grotesk · 400 / 500 / 600</div>
  <p class="lede">Made by teachers, free for everyone. Open source, no ads, no tracking.</p>
  <p class="base">Just tools that help students learn and teachers teach. <b>Weight 600</b> carries emphasis; the body sits at 400.</p>
</body>
</html>
